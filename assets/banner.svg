<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2b1a" />
      <stop offset="50%" stop-color="#14452f" />
      <stop offset="100%" stop-color="#071a10" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#27ae60" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1abc9c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic / Animated Background Graphics (Tree Rings / Topo Lines) -->
  <g opacity="0.15">
    <ellipse cx="1000" cy="150" rx="400" ry="250" fill="none" stroke="#2ecc71" stroke-width="2">
      <animate attributeName="rx" values="390;410;390" dur="8s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1000" cy="150" rx="320" ry="200" fill="none" stroke="#2ecc71" stroke-width="1.5">
      <animate attributeName="rx" values="310;330;310" dur="7s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1000" cy="150" rx="240" ry="150" fill="none" stroke="#2ecc71" stroke-width="1">
      <animate attributeName="rx" values="235;245;235" dur="6s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1000" cy="150" rx="160" ry="100" fill="none" stroke="#2ecc71" stroke-width="1" />
  </g>

  <!-- Floating Dynamic Tech Particles -->
  <g opacity="0.4">
    <circle cx="150" cy="60" r="3" fill="#2ecc71">
      <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="240" r="4" fill="#1abc9c">
      <animate attributeName="cy" values="240;250;240" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="70" r="2.5" fill="#2ecc71">
      <animate attributeName="cy" values="70;60;70" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Tree Silhouettes (Background layer) -->
  <g fill="#0e3823" opacity="0.6">
    <polygon points="920,260 950,200 980,260" />
    <polygon points="930,220 950,170 970,220" />
    <polygon points="980,270 1020,180 1060,270" />
    <polygon points="995,210 1020,150 1045,210" />
    <polygon points="1050,260 1080,195 1110,260" />
  </g>

  <!-- Foreground Text Container -->
  <g transform="translate(80, 0)">
    <!-- Top Accent Tag -->
    <rect x="0" y="55" width="220" height="28" rx="14" fill="url(#accentGrad)" opacity="0.2" />
    <text x="110" y="74" fill="#2ecc71" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Forestry Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#a3e635" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      🌲 SaaS Platforms • 🛰️ GIS &amp; Remote Sensing • 🔓 Open-Source Tools
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#14452f" stroke="#2ecc71" stroke-width="1" />
      <text x="80" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Forest Inventory</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="160" height="32" rx="8" fill="#14452f" stroke="#2ecc71" stroke-width="1" />
      <text x="255" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Timber Supply Chain</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="160" height="32" rx="8" fill="#14452f" stroke="#2ecc71" stroke-width="1" />
      <text x="430" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">LiDAR &amp; AI Analytics</text>
    </g>
  </g>
</svg>
